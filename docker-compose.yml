
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-mcp-app
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:8080"
    environment:
      MCP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_MAX_SEARCH_RESULTS: ${YOUTUBE_MAX_SEARCH_RESULTS:-25}
      YOUTUBE_MAX_UPLOAD_SAMPLE: ${YOUTUBE_MAX_UPLOAD_SAMPLE:-20}
      YOUTUBE_DEFAULT_QUOTA_DAILY_LIMIT: ${YOUTUBE_DEFAULT_QUOTA_DAILY_LIMIT:-10000}
      YOUTUBE_SEARCH_QUOTA_DAILY_LIMIT: ${YOUTUBE_SEARCH_QUOTA_DAILY_LIMIT:-100}
      YOUTUBE_CLIENT_SECRETS_FILE: /run/secrets/client_secret.json
      YOUTUBE_TOKEN_FILE: /home/appuser/.config/youtube-mcp/token.json
      YOUTUBE_OAUTH_PORT: 8080
    volumes:
      - ./credentials:/run/secrets:ro
      - youtube_auth_data:/home/appuser/.config/youtube-mcp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: youtube-mcp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  youtube_auth_data:
