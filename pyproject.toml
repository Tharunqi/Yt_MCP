[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-mcp"
version = "0.1.0"
description = "YouTube Video Intelligence MCP Server"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0,<2.0",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
]

[project.optional-dependencies]
host = [
    "openai",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]